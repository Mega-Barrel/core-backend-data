name: CI code-validate

on:
  push:
    branches: [
        "**"
    ]
    paths:
      - 'src/**'
      - '.github/workflows/**'
  pull_request:
    branches: [
        "main"
    ]
    paths:
      - 'src/**'
      - '.github/workflows/**'

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-services.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find microservice folders in src/
        id: set-services
        run: |
          # 1. cd into src directory (or fail gracefully if it doesn't exist)
          cd src || { echo "matrix=[\"none\"]" >> $GITHUB_OUTPUT; exit 0; }

          # 2. Find all directories (depth 1), strip the leading './', and convert to a JSON array
          # E.g. directories "users" and "payments" become '["users", "payments"]'
          DIRS_JSON=$(find . -maxdepth 1 -mindepth 1 -type d | sed 's|./||' | jq -R -s -c 'split("\n")[:-1]')

          # 3. If src is completely empty, output a fallback placeholder so the matrix doesn't crash
          if [ "$DIRS_JSON" == "[]" ]; then
            DIRS_JSON='["placeholder"]'
          fi

          echo "Discovered services: $DIRS_JSON"
          echo "matrix=$DIRS_JSON" >> $GITHUB_OUTPUT

  test-services:
    needs: setup 
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.setup.outputs.services) }}
        python-version: ["3.11"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Check if service directory exists
      id: check_dir
      run: |
        if [ -d "src/${{ matrix.service }}" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Directory src/${{ matrix.service }} does not exist yet. Skipping downstream steps."
        fi

    - name: Install dependencies
      if: steps.check_dir.outputs.exists == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov

        cd src/${{ matrix.service }}
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      if: steps.check_dir.outputs.exists == 'true'
      run: |
        cd src/${{ matrix.service }}
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      if: steps.check_dir.outputs.exists == 'true'
      run: |
        cd src/${{ matrix.service }}
        # || [ $? -eq 5 ] prevents failure if the folder exists but has no tests yet
        pytest || [ $? -eq 5 ]
