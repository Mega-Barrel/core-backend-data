name: CI code-validate

on:
  push:
    branches: [
        "**"
    ]
  pull_request:
    branches: [
        "main"
    ]

jobs:
  test-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false 
      matrix:
        service: 
          - "placeholder-service"
        python-version: ["3.11"] 

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Check if service directory exists
      id: check_dir
      run: |
        if [ -d "src/${{ matrix.service }}" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Directory src/${{ matrix.service }} does not exist yet. Skipping downstream steps."
        fi

    - name: Install dependencies
      if: steps.check_dir.outputs.exists == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov

        cd src/${{ matrix.service }}
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      if: steps.check_dir.outputs.exists == 'true'
      run: |
        cd src/${{ matrix.service }}
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      if: steps.check_dir.outputs.exists == 'true'
      run: |
        cd src/${{ matrix.service }}
        # || [ $? -eq 5 ] prevents failure if the folder exists but has no tests yet
        pytest || [ $? -eq 5 ]
